<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Analizador de Calidad Software</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .contenedor {
            width: 80%;
            max-width: 950px;
            margin: 50px auto;
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #1f4e79;
            margin-bottom: 10px;
            font-size: 34px;
        }

        .descripcion {
            color: #555;
            font-size: 17px;
            margin-bottom: 30px;
        }

        img {
            width: 90%;
            max-width: 800px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-bottom: 30px;
        }

        .boton {
            display: inline-block;
            padding: 14px 32px;
            background-color: #1f4e79;
            color: white;
            text-decoration: none;
            font-size: 18px;
            border-radius: 8px;
            font-weight: bold;
        }

        .boton:hover {
            background-color: #163a59;
        }

        .nota {
            margin-top: 22px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="contenedor">
        <h1>Analizador de Calidad Software</h1>

        <p class="descripcion">
            Aplicación para analizar proyectos software mediante métricas de calidad y generar un informe de resultados.
        </p>

        <img src="imagen_inicio.png" alt="Imagen inicial del programa">

        <br>

        <a class="boton" href="#">
            Iniciar programa
        </a>

        <p class="nota">
            Al pulsar el botón se iniciará la ejecución del programa desde el fichero de arranque.
        </p>
    </div>
</body>
</html>
